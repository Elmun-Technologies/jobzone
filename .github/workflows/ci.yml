name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # Migrations never run in CI — they reach the database through the operator's
  # `supabase db push` — so this is the only automated check they get. It costs
  # seconds and catches the one mistake that would otherwise surface as a
  # missing table in production.
  migrations:
    name: Migration versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-migrations.sh

  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - name: Check formatting (tracked Dart files; generated is gitignored)
        run: dart format --set-exit-if-changed $(git ls-files '*.dart')
